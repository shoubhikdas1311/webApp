<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Web App</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f6f8fa;
            color: #24292f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 32px;
            box-shadow: 0 3px 6px rgba(140,149,159,0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #0969da; }
        p { color: #57606a; margin-bottom: 24px; }
        button {
            background-color: #2da44e;
            color: white;
            border: 1px solid rgba(27,31,36,0.15);
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background-color: #2c974b; }
        .counter { font-size: 48px; font-weight: bold; margin: 16px 0; color: #24292f; }
    </style>
</head>
<body>
    <div class="card">
        <h1>My First Web App</h1>
        <p>Deployed live via GitHub Pages</p>
        <div class="counter" id="counter">0</div>
        <button id="clickBtn">Click to Count</button>
    </div>

    <script>
        let count = 0;
        const counterEl = document.getElementById('counter');
        const btnEl = document.getElementById('clickBtn');

        btnEl.addEventListener('click', () => {
            count++;
            counterEl.textContent = count;
        });
    </script>
</body>
</html>
